<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – FAIRkaufswerkstatt</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2c3736;--ink-2:#4b5b5a;--muted:#6a7a78;--paper:#f6f5f0;--line:#ded9cf;--mint:#4b5b5a;--marker:#ffd23f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;
    font-size:17px;line-height:1.55;padding:40px 22px}
  .box{max-width:520px;text-align:center}
  .code{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800;
    font-size:clamp(3.4rem,14vw,5.4rem);line-height:1;letter-spacing:-.04em;margin:0 0 6px}
  h1{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800;letter-spacing:-.02em;
    font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.15;margin:0 0 14px;text-wrap:balance}
  h1 .hl{background:linear-gradient(transparent 62%,var(--marker) 62%);padding:0 2px}
  p{color:var(--muted);margin:0 0 28px;text-wrap:pretty}
  a.btn{display:inline-block;background:var(--mint);color:#fff;text-decoration:none;font-weight:600;
    padding:15px 26px;border-radius:999px;min-height:48px}
  a.btn:hover{background:#394746}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Diese Seite ist <span class="hl">ausgezogen.</span></h1>
    <p>Der Link stimmt nicht mehr oder hat sich vertippt. Kein Drama – auf der Startseite findest du alles.</p>
    <a class="btn" href="/">Zur Startseite</a>
  </div>
</body>
</html>
